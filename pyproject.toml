[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-kit"
version = "0.1.0"
description = "A portable agent harness and supervisor orchestration loop for LangGraph, CrewAI, AWS Bedrock AgentCore/Strands, and raw LLM backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Hard dependencies: stdlib only. Everything framework/SDK-specific is an
# optional extra, lazy-imported by the backend that needs it.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
langgraph = ["langgraph>=0.2.0"]
crewai = ["crewai>=0.80.0"]
strands = ["strands-agents>=0.1.0"]
# Convenience bundle pulling in every optional backend's SDK.
all = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "crewai>=0.80.0",
    "strands-agents>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
